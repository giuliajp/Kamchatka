name: Frontend and admin

on:
  pull_request:
    paths: ['frontend/**', 'admin-panel/**', 'scripts/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'admin-panel/**', 'scripts/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-panel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-panel/package-lock.json
      # Both installs keep shared public contract types and test fixtures resolvable.
      - run: npm ci --prefix frontend
      - run: npm ci --prefix admin-panel
      - run: npm run check
        working-directory: ${{ matrix.app }}
      - run: npm audit --audit-level=moderate
        working-directory: ${{ matrix.app }}
