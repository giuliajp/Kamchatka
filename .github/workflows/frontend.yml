name: Frontend and admin

on:
  pull_request:
    paths: ['frontend/**', 'admin-panel/**', 'scripts/**', 'backend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'admin-panel/**', 'scripts/**', 'backend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-panel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-panel/package-lock.json
      # Both installs keep shared public contract types and test fixtures resolvable.
      - run: npm ci --prefix frontend
      - run: npm ci --prefix admin-panel
      - run: npm run check
        working-directory: ${{ matrix.app }}
      - run: npm audit --audit-level=moderate
        working-directory: ${{ matrix.app }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avacha_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: avacha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avacha_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: avacha_test
      POSTGRES_PASSWORD: isolated-ci-password
      POSTGRES_DB: avacha_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      LC_ALL: C.UTF-8
      TRACKER_POLLING_ENABLED: 'false'
      REMINDERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q --junitxml=../test-results/backend.xml
        working-directory: backend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-results
          path: test-results/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix admin-panel
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
